[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "south_german_credit_mlops"
version = "0.0.1"
description = "Credit risk classification using Scikit-Learn and MLflow"
authors = [
  { name = "Netsa_Rom" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["south_german_credit_mlops"]
include = ["pyproject.toml", "south_german_credit_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["south_german_credit_mlops"]
force-sort-within-sections = true

